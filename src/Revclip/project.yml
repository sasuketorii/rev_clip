name: Revclip
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.revclip
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - Base
    - ko
    - fr
    - pt-BR
    - en
    - ja
    - de
    - zh-Hans
    - vi
    - it

configs:
  Debug: debug
  Release: release
  Demo: release

# Distribution and local user-test builds must not collect runtime coverage.
# XCTest can opt in explicitly when a coverage report is required.
settings:
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_CODE_COVERAGE: NO
      CLANG_ENABLE_CODE_COVERAGE: NO
      CLANG_COVERAGE_MAPPING: NO
    Demo:
      ENABLE_CODE_COVERAGE: NO
      CLANG_ENABLE_CODE_COVERAGE: NO
      CLANG_COVERAGE_MAPPING: NO

targets:
  Revclip:
    type: application
    platform: macOS
    dependencies:
      - target: RevclipCLI
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: CoreFoundation.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Vision.framework
      - sdk: CoreText.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - framework: Revclip/Vendor/Sparkle/Sparkle.framework
        embed: true
        weak: true
    info:
      path: Revclip/Info.plist
      properties:
        CFBundleName: "$(PRODUCT_NAME)"
        CFBundleDisplayName: "$(PRODUCT_NAME)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "59"
        CFBundleShortVersionString: "0.2.1"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: "APPL"
        CFBundleSignature: "????"
        NSMainNibFile: "MainMenu"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: "NSApplication"
        NSHumanReadableCopyright: "Copyright © 2024-2026 Revclip. Licensed under AGPL-3.0-only; see THIRD_PARTY_NOTICES.md for prior code."
        CFBundleIconName: "AppIcon"
        # Official update feed. Forks should use their own feed and signing key.
        SUFeedURL: "$(RC_SU_FEED_URL)"
        SUPublicEDKey: "$(RC_SU_PUBLIC_ED_KEY)"
        RCStorageDirectoryName: "$(RC_STORAGE_DIRECTORY_NAME)"
        RCBugReportURL: "https://revclip-feedback.sasuketorii-business.workers.dev/report"
        NSAccessibilityUsageDescription: "Revclip needs accessibility access to paste clipboard items into other applications."
        # A text-returning service: the requesting app inserts what the user picked from
        # the Revclip menu. It takes no input, so it is offered in an empty text field.
        NSServices:
          - NSMenuItem:
              default: "$(RC_SERVICE_MENU_TITLE)"
            NSMessage: "insertFromRevclip"
            NSPortName: "$(PRODUCT_NAME)"
            NSReturnTypes:
              - "NSStringPboardType"
              - "public.utf8-plain-text"
            NSRequiredContext: {}
            NSTimeout: "60000"
    sources:
      - path: Revclip
        excludes:
          - "Vendor/Sparkle/**"
          - "Vendor/SQLCipher/sqlite3.c"
      # SQLite's amalgamation is compiled with the release assert contract.
      # The Cocoa prefix header imports assert.h before SQLite selects its
      # NDEBUG/SQLITE_DEBUG mode; keep that mode consistent for this file.
      - path: Revclip/Vendor/SQLCipher/sqlite3.c
        compilerFlags: "-DNDEBUG"
      - path: ../../agents/AgentSupport
        type: folder
        buildPhase: resources
    postCompileScripts:
      - name: Embed native CLI
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/revclip" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/revclip"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/revclip"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/revclip"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revclip.Revclip
        PRODUCT_NAME: Revclip
        RC_STORAGE_DIRECTORY_NAME: Revclip
        RC_SERVICE_MENU_TITLE: Revclip
        RC_SU_FEED_URL: "https://github.com/sasuketorii/rev_clip/releases/latest/download/appcast.xml"
        RC_SU_PUBLIC_ED_KEY: "jW5CH5/B8IApRFYiwOGot/VUmo0uqvE1LawgUG1igUk="
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        INFOPLIST_FILE: Revclip/Info.plist
        CODE_SIGN_ENTITLEMENTS: Revclip/Revclip.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: ""
        CLANG_ENABLE_OBJC_ARC: true
        GCC_PREFIX_HEADER: Revclip/Revclip-Prefix.pch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Revclip/Vendor"
          - "$(PROJECT_DIR)/Revclip/Vendor/Sparkle"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Revclip/Vendor/SQLCipher"
          - "$(inherited)"
        OTHER_LDFLAGS:
          - "$(inherited)"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SQLITE_HAS_CODEC=1"
          - "SQLCIPHER_CRYPTO_CC=1"
          - "SQLITE_TEMP_STORE=2"
          - "SQLITE_THREADSAFE=2"
          - "SQLITE_EXTRA_INIT=sqlcipher_extra_init"
          - "SQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
        CLANG_ENABLE_MODULES: true
        GCC_PRECOMPILE_PREFIX_HEADER: true
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: Revclip
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_OBJC_BRIDGING_HEADER: Revclip/Revclip-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: Revclip-Swift.h
      configs:
        Release:
          ONLY_ACTIVE_ARCH: false
          CODE_SIGN_IDENTITY: "Developer ID Application"
        Debug:
          ONLY_ACTIVE_ARCH: true
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_ENTITLEMENTS: ""
        Demo:
          PRODUCT_BUNDLE_IDENTIFIER: com.revclip.revclip-demo
          PRODUCT_NAME: revclip-demo
          RC_STORAGE_DIRECTORY_NAME: revclip-demo
          RC_SERVICE_MENU_TITLE: Revclip Demo
          RC_SU_FEED_URL: ""
          RC_SU_PUBLIC_ED_KEY: ""
          ONLY_ACTIVE_ARCH: false
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_ENTITLEMENTS: ""

  RevclipCLI:
    type: tool
    platform: macOS
    sources:
      - path: RevclipCLI
    settings:
      base:
        PRODUCT_NAME: revclip
        PRODUCT_BUNDLE_IDENTIFIER: com.revclip.cli
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        CLANG_ENABLE_OBJC_ARC: true
        OTHER_CFLAGS: "$(inherited) -fobjc-arc-exceptions"
        SKIP_INSTALL: true
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: ""
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Demo:
          CODE_SIGNING_ALLOWED: NO

  RevclipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RevclipTests
    dependencies:
      - target: Revclip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revclip.RevclipTests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Revclip/Vendor/SQLCipher"
          - "$(inherited)"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SQLITE_HAS_CODEC=1"
          - "SQLCIPHER_CRYPTO_CC=1"
          - "SQLITE_TEMP_STORE=2"
          - "SQLITE_THREADSAFE=2"
          - "SQLITE_EXTRA_INIT=sqlcipher_extra_init"
          - "SQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Revclip.app/Contents/MacOS/Revclip"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
