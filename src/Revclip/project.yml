name: Revclip
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.revclip
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - Base
    - ko
    - fr
    - pt-BR
    - en
    - ja
    - de
    - zh-Hans
    - it

targets:
  Revclip:
    type: application
    platform: macOS
    dependencies:
      - sdk: ApplicationServices.framework
      - sdk: Carbon.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - framework: Revclip/Vendor/Sparkle/Sparkle.framework
        embed: true
        weak: true
    info:
      path: Revclip/Info.plist
      properties:
        CFBundleName: "Revclip"
        CFBundleDisplayName: "Revclip"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion: "29"
        CFBundleShortVersionString: "0.0.29"
        CFBundleExecutable: "$(EXECUTABLE_NAME)"
        CFBundlePackageType: "APPL"
        CFBundleSignature: "????"
        NSMainNibFile: "MainMenu"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: "NSApplication"
        NSHumanReadableCopyright: "Copyright © 2024-2026 Revclip. Licensed under the MIT License."
        CFBundleIconName: "AppIcon"
        # Official update feed. Forks should use their own feed and signing key.
        SUFeedURL: "https://github.com/sasuketorii/rev_clip/releases/latest/download/appcast.xml"
        SUPublicEDKey: "jW5CH5/B8IApRFYiwOGot/VUmo0uqvE1LawgUG1igUk="
        NSAccessibilityUsageDescription: "Revclip needs accessibility access to paste clipboard items into other applications."
    sources:
      - path: Revclip
        excludes:
          - "Vendor/Sparkle/**"
          - "Vendor/SQLCipher/sqlite3.c"
      # SQLite's amalgamation is compiled with the release assert contract.
      # The Cocoa prefix header imports assert.h before SQLite selects its
      # NDEBUG/SQLITE_DEBUG mode; keep that mode consistent for this file.
      - path: Revclip/Vendor/SQLCipher/sqlite3.c
        compilerFlags: "-DNDEBUG"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revclip.Revclip
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
        INFOPLIST_FILE: Revclip/Info.plist
        CODE_SIGN_ENTITLEMENTS: Revclip/Revclip.entitlements
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: ""
        CLANG_ENABLE_OBJC_ARC: true
        GCC_PREFIX_HEADER: Revclip/Revclip-Prefix.pch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Revclip/Vendor"
          - "$(PROJECT_DIR)/Revclip/Vendor/Sparkle"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Revclip/Vendor/SQLCipher"
          - "$(inherited)"
        OTHER_LDFLAGS:
          - "$(inherited)"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SQLITE_HAS_CODEC=1"
          - "SQLCIPHER_CRYPTO_CC=1"
          - "SQLITE_TEMP_STORE=2"
          - "SQLITE_THREADSAFE=2"
          - "SQLITE_EXTRA_INIT=sqlcipher_extra_init"
          - "SQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
        CLANG_ENABLE_MODULES: true
        GCC_PRECOMPILE_PREFIX_HEADER: true
        DEFINES_MODULE: YES
        PRODUCT_MODULE_NAME: Revclip
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: targeted
        SWIFT_OBJC_BRIDGING_HEADER: Revclip/Revclip-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: Revclip-Swift.h
      configs:
        Release:
          ONLY_ACTIVE_ARCH: false
          CODE_SIGN_IDENTITY: "Developer ID Application"
        Debug:
          ONLY_ACTIVE_ARCH: true
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGN_ENTITLEMENTS: ""

  RevclipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RevclipTests
    dependencies:
      - target: Revclip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.revclip.RevclipTests
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Revclip/Vendor/SQLCipher"
          - "$(inherited)"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "SQLITE_HAS_CODEC=1"
          - "SQLCIPHER_CRYPTO_CC=1"
          - "SQLITE_TEMP_STORE=2"
          - "SQLITE_THREADSAFE=2"
          - "SQLITE_EXTRA_INIT=sqlcipher_extra_init"
          - "SQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Revclip.app/Contents/MacOS/Revclip"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "6.0"
