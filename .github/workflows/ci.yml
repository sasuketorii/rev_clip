name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify Python runtime
        run: python3 --version
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: |
          bash scripts/install_xcodegen.sh "${RUNNER_TEMP}/xcodegen"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Verify vendored Sparkle
        run: |
          python3 -m unittest discover -s scripts/tests -p test_build_provenance.py -v
          python3 scripts/verify_sparkle.py
      - name: Audit demo feature parity
        run: python3 scripts/check_demo_parity.py
      - name: Test release delivery guard
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_release_delivery.py -v
      - name: Test agent installer and CLI
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_agent_install.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p test_revclip_cli.py -v
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install feedback test dependencies
        working-directory: services/feedback
        run: npm ci
      - name: Test feedback relay
        working-directory: services/feedback
        run: npm test
      - name: Generate project
        run: make -C src/Revclip setup
      - name: Test
        run: make -C src/Revclip test
      - name: Test native CLI and skill installer
        run: >-
          REVCLIP_NATIVE_CLI="$PWD/src/Revclip/build/Debug/revclip"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_native*.py' -v
      - name: Test optimized regular build
        run: >-
          xcodebuild -project src/Revclip/Revclip.xcodeproj -scheme Revclip
          -configuration Release -destination 'platform=macOS'
          ENABLE_TESTABILITY=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS=RC_TESTING
          'GCC_PREPROCESSOR_DEFINITIONS=$(inherited) RC_TESTING=1'
          CODE_SIGNING_ALLOWED=NO test
      - name: Build universal app
        working-directory: src/Revclip
        run: >-
          xcodebuild -project Revclip.xcodeproj -scheme Revclip
          -configuration Release -arch arm64 -arch x86_64 ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
