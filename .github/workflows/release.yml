name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-sign:
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      manifest-sha: ${{ steps.delivery.outputs.manifest-sha }}
      build-number: ${{ steps.delivery.outputs.build-number }}
    runs-on: macos-26
    timeout-minutes: 40
    env:
      PROJECT_DIR: src/Revclip
      SCHEME: Revclip
      RELEASE_DIR: ${{ github.workspace }}/build/release
      ARCHIVE_PATH: ${{ github.workspace }}/build/release/Revclip.xcarchive
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Verify Python runtime
        run: python3 --version
      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          # Pin the latest stable Xcode 26.x on macos-26 (arm64). Do not use Xcode 27 beta.
          # Path from https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
          XCODE_PATH="/Applications/Xcode_26.6.app"
          if [[ ! -d "${XCODE_PATH}" ]]; then
            echo "Xcode 26.6 not found at ${XCODE_PATH}"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE_PATH}"
          xcodebuild -version

      # Required secret:
      # - Repository Settings -> Secrets and variables -> Actions -> New repository secret
      # - Name: SPARKLE_PRIVATE_KEY
      # - Value: Sparkle private EdDSA key (from generate_keys)
      - name: Validate required secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in SPARKLE_PRIVATE_KEY APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret is not configured: ${name}"
              exit 1
            fi
          done

      - name: Install pinned XcodeGen
        run: |
          bash scripts/install_xcodegen.sh "${RUNNER_TEMP}/xcodegen"
          echo "${RUNNER_TEMP}/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Validate version matches tag
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          YML_SHORT=$(sed -nE 's/^[[:space:]]*CFBundleShortVersionString:[[:space:]]*"([^"]+)".*/\1/p' project.yml | head -n1)
          YML_BUILD=$(sed -nE 's/^[[:space:]]*CFBundleVersion:[[:space:]]*"([^"]+)".*/\1/p' project.yml | head -n1)

          if [[ -z "$YML_SHORT" ]]; then
            echo "::error::Failed to read CFBundleShortVersionString from project.yml"
            exit 1
          fi
          if [[ -z "$YML_BUILD" ]]; then
            echo "::error::Failed to read CFBundleVersion from project.yml"
            exit 1
          fi

          ERRORS=0
          if [[ "$YML_SHORT" != "$TAG_VERSION" ]]; then
            echo "::error::project.yml CFBundleShortVersionString ($YML_SHORT) != tag ($TAG_VERSION)"
            ERRORS=1
          fi
          if [[ ! "$YML_BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CFBundleVersion must be a positive integer"
            ERRORS=1
          fi
          if [[ "$ERRORS" -ne 0 ]]; then
            echo ""
            echo "Fix: Update CFBundleShortVersionString and CFBundleVersion in project.yml before tagging."
            exit 1
          fi
          PREVIOUS_FEED="${RUNNER_TEMP}/revclip-previous-appcast.xml"
          curl --fail --silent --show-error --location --max-time 30 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" -o "$PREVIOUS_FEED"
          python3 -c 'import sys, xml.etree.ElementTree as E; versions = [int(n.text) for n in E.parse(sys.argv[1]).iter("{http://www.andymatuschak.org/xml-namespaces/sparkle}version")]; assert versions and int(sys.argv[2]) > max(versions), "Build must exceed the published build"' "$PREVIOUS_FEED" "$YML_BUILD"
          echo "Version validation passed: $TAG_VERSION (build $YML_BUILD)"

      - name: Verify Sparkle and prepare pinned tools
        run: |
          python3 scripts/verify_sparkle.py --tools-dir "${RUNNER_TEMP}/sparkle-tools"
          echo "SPARKLE_BIN=${RUNNER_TEMP}/sparkle-tools/bin" >> "$GITHUB_ENV"

      - name: Install pinned Rilmazafone
        run: |
          set -euo pipefail
          INSTALLER="${RUNNER_TEMP}/Rilmazafone-2.6.dmg"
          MOUNT="${RUNNER_TEMP}/rilmazafone-mount"
          curl -fsSL "https://github.com/kageroumado/rilmazafone/releases/download/v2.6/Rilmazafone-2.6.dmg" -o "${INSTALLER}"
          echo "adcc38f60149256df5194b7619295246f9fe85bebe919dd9896e0c1fd999daaa  ${INSTALLER}" | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "${MOUNT}" "${INSTALLER}"
          trap 'hdiutil detach "${MOUNT}" -quiet' EXIT
          codesign --verify --deep --strict "${MOUNT}/Rilmazafone.app"
          spctl --assess --type execute "${MOUNT}/Rilmazafone.app"
          ditto "${MOUNT}/Rilmazafone.app" "${RUNNER_TEMP}/Rilmazafone.app"
          echo "RILMAZAFONE_APP=${RUNNER_TEMP}/Rilmazafone.app" >> "${GITHUB_ENV}"

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/apple-certificate.p12"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          trap 'rm -f "${CERTIFICATE_PATH}"' EXIT

          if ! printf '%s' "${APPLE_CERTIFICATE_P12}" | base64 --decode > "${CERTIFICATE_PATH}" 2>/dev/null; then
            printf '%s' "${APPLE_CERTIFICATE_P12}" | base64 -D > "${CERTIFICATE_PATH}"
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild \
            -T /usr/bin/xcodebuild
          security list-keychains -d user -s "${KEYCHAIN_PATH}" "${HOME}/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          rm -f "${CERTIFICATE_PATH}"

      - name: Build archive (with signing + hardened runtime)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_DIR}"
          rm -rf "${ARCHIVE_PATH}"
          xcodebuild archive \
            -project "${PROJECT_DIR}/Revclip.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -archivePath "${ARCHIVE_PATH}" \
            -destination "generic/platform=macOS" \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            ONLY_ACTIVE_ARCH=NO

      - name: Extract .app from archive
        run: |
          set -euo pipefail
          ARCHIVED_APP_PATH="${ARCHIVE_PATH}/Products/Applications/Revclip.app"
          if [[ ! -d "${ARCHIVED_APP_PATH}" ]]; then
            echo "Archived app not found: ${ARCHIVED_APP_PATH}"
            exit 1
          fi

          EXPORTED_APP_PATH="${RELEASE_DIR}/Revclip.app"
          rm -rf "${EXPORTED_APP_PATH}"
          ditto "${ARCHIVED_APP_PATH}" "${EXPORTED_APP_PATH}"
          echo "APP_PATH=${EXPORTED_APP_PATH}" >> "${GITHUB_ENV}"

      - name: Re-sign Sparkle framework for notarization
        run: |
          set -euo pipefail
          SPARKLE_FW="${APP_PATH}/Contents/Frameworks/Sparkle.framework"
          if [[ ! -d "${SPARKLE_FW}" ]]; then
            echo "Sparkle.framework not found: ${SPARKLE_FW}"
            exit 1
          fi

          SIGN_IDENTITY="Developer ID Application"

          # Sign from inside out: XPC services first, then apps, then framework
          # XPC Services
          for xpc in "${SPARKLE_FW}/Versions/B/XPCServices/"*.xpc; do
            if [[ -d "${xpc}" ]]; then
              codesign --force --options runtime --timestamp --sign "${SIGN_IDENTITY}" "${xpc}"
            fi
          done

          # Updater.app
          if [[ -d "${SPARKLE_FW}/Versions/B/Updater.app" ]]; then
            codesign --force --options runtime --timestamp --sign "${SIGN_IDENTITY}" "${SPARKLE_FW}/Versions/B/Updater.app"
          fi

          # Autoupdate binary
          if [[ -f "${SPARKLE_FW}/Versions/B/Autoupdate" ]]; then
            codesign --force --options runtime --timestamp --sign "${SIGN_IDENTITY}" "${SPARKLE_FW}/Versions/B/Autoupdate"
          fi

          # Sparkle framework itself
          codesign --force --options runtime --timestamp --sign "${SIGN_IDENTITY}" "${SPARKLE_FW}"

          # Re-sign the main app (since framework signature changed)
          codesign --force --options runtime --timestamp --entitlements "${PROJECT_DIR}/Revclip/Revclip.entitlements" --sign "${SIGN_IDENTITY}" "${APP_PATH}"

          # Verify
          codesign --verify --deep --strict "${APP_PATH}"

      - name: Verify distribution signatures and entitlements
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 scripts/verify_app_signature.py "$APP_PATH" --team "$APPLE_TEAM_ID"

      - name: Package DMG
        run: |
          set -euo pipefail
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "App bundle not found: ${APP_PATH}"
            exit 1
          fi

          DMG_PATH="${RELEASE_DIR}/Revclip-${GITHUB_REF_NAME}.dmg"
          bash "${PROJECT_DIR}/Scripts/create_dmg.sh" "${APP_PATH}" "${DMG_PATH}"

          codesign --force --timestamp --sign "Developer ID Application" "$DMG_PATH"
          echo "DMG_PATH=${DMG_PATH}" >> "${GITHUB_ENV}"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ ! -f "${DMG_PATH}" ]]; then
            echo "DMG not found: ${DMG_PATH}"
            exit 1
          fi

          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait

          xcrun stapler staple "${DMG_PATH}"

      - name: Sign DMG with Sparkle EdDSA
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SIGN_UPDATE="${SPARKLE_BIN}/sign_update"
          if [[ ! -x "${SIGN_UPDATE}" ]]; then
            echo "sign_update not found: ${SIGN_UPDATE}"
            exit 1
          fi

          # Validate key + produce signature. Signature is not logged.
          printf '%s' "${SPARKLE_PRIVATE_KEY}" | "${SIGN_UPDATE}" --ed-key-file - -p "${DMG_PATH}" > /dev/null

      - name: Generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APPCAST_PATH="${RELEASE_DIR}/appcast.xml"
          GENERATE_APPCAST="${SPARKLE_BIN}/generate_appcast"
          if [[ ! -x "${GENERATE_APPCAST}" ]]; then
            echo "generate_appcast not found: ${GENERATE_APPCAST}"
            exit 1
          fi

          DOWNLOAD_PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          printf '%s' "${SPARKLE_PRIVATE_KEY}" | \
            "${GENERATE_APPCAST}" \
              --ed-key-file - \
              --download-url-prefix "${DOWNLOAD_PREFIX}" \
              --link "https://github.com/${GITHUB_REPOSITORY}/releases" \
              -o "${APPCAST_PATH}" \
              "${RELEASE_DIR}"

          echo "APPCAST_PATH=${APPCAST_PATH}" >> "${GITHUB_ENV}"

      - name: Validate appcast.xml contains EdDSA signature
        run: |
          set -euo pipefail
          if [[ ! -f "${APPCAST_PATH}" ]]; then
            echo "appcast.xml not found: ${APPCAST_PATH}"
            exit 1
          fi

          if ! grep -Eq 'sparkle:edSignature="[^"]+"' "${APPCAST_PATH}"; then
            echo "ERROR: appcast.xml does not contain a non-empty sparkle:edSignature."
            echo "This means the Sparkle EdDSA signing failed silently."
            echo "Check that SPARKLE_PRIVATE_KEY matches the SUPublicEDKey in the app."
            cat "${APPCAST_PATH}"
            exit 1
          fi

          echo "appcast.xml validation passed: EdDSA signature found."

      - name: Cleanup temporary keychain
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "${KEYCHAIN_PATH}" ]]; then
            security default-keychain -d user -s "${HOME}/Library/Keychains/login.keychain-db"
            security delete-keychain "${KEYCHAIN_PATH}"
          fi

      - name: Prepare release transfer
        id: delivery
        run: |
          set -euo pipefail
          mkdir -p release-transfer
          cp "$DMG_PATH" "$APPCAST_PATH" release-transfer/
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Contents/Info.plist")
          echo "build-number=$build" >> "$GITHUB_OUTPUT"
          cd release-transfer
          shasum -a 256 ./*.dmg appcast.xml > SHA256SUMS
          echo "manifest-sha=$(shasum -a 256 SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Transfer signed artifacts
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: release-transfer/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build-sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout delivery verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this run's signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-sign.outputs.artifact-id }}
          path: release-transfer
          merge-multiple: true
      - name: Verify transfer checksums
        working-directory: release-transfer
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.build-sign.outputs.manifest-sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]]
          echo "$EXPECTED_MANIFEST_SHA  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            release-transfer/*.dmg release-transfer/appcast.xml
      - name: Verify public release delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.build-sign.outputs.build-number }}
        run: |
          python3 scripts/verify_release_delivery.py \
            --tag "$GITHUB_REF_NAME" --build "$BUILD_NUMBER" --sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-delivery.json"
